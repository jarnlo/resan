<style>
  /* Helskärm: bilden är bakgrunden, allt innehåll ligger i en panel längst ner (tummens zon). */
  :root {
    --ink: #fff;
    --ink-2: rgba(255,255,255,.74);
    --ink-3: rgba(255,255,255,.5);
    --line: rgba(255,255,255,.16);
    --chip: rgba(255,255,255,.14);
    --accent: #ff7a45;
    --accent-2: #ffb26b;
    --note: #ffd27a;
    --ground: #14110f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-shadow: 0 1px 3px rgba(0,0,0,.45);
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }

  .bg, .bgimg, .shade { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bg { background-size: cover; background-position: center; }
  .bgimg { object-fit: cover; opacity: 0; transition: opacity 1.6s ease; }
  .bgimg.in { opacity: 1; }
  .shade { background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.08) 24%, rgba(0,0,0,.25) 45%, rgba(0,0,0,.86) 78%); }

  main {
    position: relative; min-height: 100%; display: flex; flex-direction: column;
    padding-top: max(16px, env(safe-area-inset-top, 0px));
    padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    max-width: 560px; margin: 0 auto;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .brand { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; font-weight: 800; white-space: nowrap; padding-top: 6px; }
  .brand .day { color: var(--accent); letter-spacing: .08em; }
  .place { font-size: 24px; font-weight: 700; line-height: 1.1; text-align: right; min-width: 0; text-wrap: balance; }
  .ext { font-size: 13px; font-weight: 400; opacity: .55; margin-left: 2px; }

  .panel { margin-top: auto; padding-top: 40vh; }
  .viewing { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
             font-size: 13px; color: var(--note); }
  .back { background: var(--chip); border: 0; color: var(--ink); font: inherit; font-size: 13px;
          padding: 5px 12px; border-radius: 14px; text-shadow: none; cursor: pointer; }
  .date { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
  .clockrow { display: flex; justify-content: space-between; align-items: flex-end; margin: 6px 0 12px; }
  .clock { font-size: 60px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  .clocklabel { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .wx { text-align: right; display: block; }
  .wxicon { width: 28px; height: 28px; vertical-align: -5px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .wxtemp { font-size: 30px; font-weight: 600; margin-left: 4px; }
  .wxsub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  .sep { height: 1px; background: var(--line); margin: 0 0 14px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 8px; font-weight: 700; text-wrap: balance; }
  .text { font-size: 16px; line-height: 1.45; margin: 0; color: rgba(255,255,255,.92); }
  .trip { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 8px 12px; border-radius: 12px;
          background: var(--chip); font-size: 14px; color: var(--ink-2); text-shadow: none; }
  .trip b { color: var(--ink); font-weight: 600; }

  .scrub { margin-top: 22px; }
  .timeline { position: relative; height: 30px; touch-action: none; }
  .track, .fill { position: absolute; left: 10px; top: 14px; height: 2px; border-radius: 1px; }
  .track { right: 10px; background: rgba(255,255,255,.2); }
  .fill { background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 8px rgba(255,122,69,.6); }
  .dot { position: absolute; top: 13px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%;
         background: rgba(255,255,255,.3); pointer-events: none; }
  .dot.past { background: var(--accent-2); }
  input[type=range] { position: absolute; inset: 0; width: 100%; height: 30px; margin: 0; padding: 0 4px;
                      -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
                      background: #fff; border: 0; box-shadow: 0 1px 5px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 0;
                      box-shadow: 0 1px 5px rgba(0,0,0,.5); }
  input[type=range]:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 8px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 12px; }
  .thumbdate { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: var(--chip); text-shadow: none;
               font-variant-numeric: tabular-nums; }
  .arrows { display: flex; gap: 8px; }
  .arrow { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--chip); color: var(--ink);
           display: grid; place-items: center; cursor: pointer; }
  .arrow:active { transform: scale(.94); }
  .arrow:disabled { opacity: .25; }
  .arrow:focus-visible, .back:focus-visible, a:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .credit { font-size: 11px; color: var(--ink-3); margin-top: 12px; min-height: 14px; text-shadow: none; }
  .credit a { text-decoration: underline; text-underline-offset: 2px; }
  .state { margin-top: auto; padding-top: 50vh; }
  .state h1 { font-size: 34px; }
  @media (prefers-reduced-motion: reduce) { .bgimg { transition: none; } }
</style>

// ---------- väderikoner ----------
const WX = (c, night) => {
  if (c === 0) return [night ? "moon" : "sun", "Klart"];
  if (c <= 2) return [night ? "cloudMoon" : "cloudSun", "Lätt molnigt"];
  if (c === 3) return ["cloud", "Mulet"];
  if (c <= 48) return ["fog", "Dimma"];
  if (c <= 57) return ["drizzle", "Duggregn"];
  if (c <= 67) return ["rain", "Regn"];
  if (c <= 77) return ["snow", "Snö"];
  if (c <= 82) return ["rain", "Regnskurar"];
  return ["storm", "Åska"];
};
const CLOUD = "M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.1 9.5 4.25 4.25 0 0 0 7 18z";
const CLOUD_SM = "M8.5 19h8a3.5 3.5 0 0 0 .5-6.96 4.75 4.75 0 0 0-9.1-1.3A3.65 3.65 0 0 0 8.5 19z";
const BASE_CLOUD = (y) => `M7 ${y}h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.1 ${y - 8.5} 4.25 4.25 0 0 0 7 ${y}z`;
const rays = (cx, cy, r1, r2) => [0, 45, 90, 135, 180, 225, 270, 315].map((a) => {
  const t = (a * Math.PI) / 180;
  return `<line x1="${cx + r1 * Math.cos(t)}" y1="${cy + r1 * Math.sin(t)}" x2="${cx + r2 * Math.cos(t)}" y2="${cy + r2 * Math.sin(t)}"/>`;
}).join("");
const drops = (xs) => xs.map((x) => `<line x1="${x}" y1="19.5" x2="${x - 1}" y2="22"/>`).join("");
const wxIcon = (k) => {
  const g = {
    sun: `<circle cx="12" cy="12" r="4.2"/>${rays(12, 12, 6.8, 9.2)}`,
    moon: `<path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/>`,
    cloudSun: `<g mask="url(#cm)"><circle cx="8.5" cy="8" r="3"/>${rays(8.5, 8, 4.8, 6.4)}</g><path d="${CLOUD_SM}"/>`,
    cloudMoon: `<g mask="url(#cm)"><path d="M12 6.2A4 4 0 0 1 6.2 2.5a4.6 4.6 0 1 0 5.8 3.7z"/></g><path d="${CLOUD_SM}"/>`,
    cloud: `<path d="${CLOUD}"/>`,
    fog: `<path d="${BASE_CLOUD(13)}"/><line x1="4" y1="17" x2="20" y2="17"/><line x1="6" y1="20.5" x2="18" y2="20.5"/>`,
    drizzle: `<path d="${BASE_CLOUD(16)}"/>${drops([9, 15])}`,
    rain: `<path d="${BASE_CLOUD(16)}"/>${drops([8, 12, 16])}`,
    snow: `<path d="${BASE_CLOUD(16)}"/><circle cx="9" cy="20" r=".6"/><circle cx="12" cy="21.5" r=".6"/><circle cx="15" cy="20" r=".6"/>`,
    storm: `<path d="${BASE_CLOUD(15)}"/><path d="M12.5 15l-2 3.5h3l-2 3.5"/>`,
  }[k] || "";
  return `<svg class="wxicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

};
const wxWord = (c) => c == null ? null : c <= 1 ? "sunny" : c <= 3 ? "cloudy" : c <= 48 ? "mist" : c <= 82 ? "rain" : "storm";

// ---------- tid (resan = UTC+7) ----------
const miraNow = () => new Date(Date.now() + 7 * 3600000);
const todayNumber = () => {
  const d = miraNow();
  return Math.round((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - START) / 86400000) + 1;
};
const dateOf = (n) => new Date(START + (n - 1) * 86400000);
const isoDate = (n) => dateOf(n).toISOString().slice(0, 10);
const WEEKDAYS = ["sön", "mån", "tis", "ons", "tors", "fre", "lör"];
const MONTHS = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const dateStr = (n) => { const d = dateOf(n); return `${WEEKDAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const hhmm = (d, utc) => utc
  ? String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0")
  : String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
const timeOfDay = () => {
  const h = miraNow().getUTCHours();
  return h >= 5 && h < 8 ? "sunrise" : h >= 8 && h < 17 ? "day" : h >= 17 && h < 19 ? "sunset" : "night";
};
// Svensk tid (sommar/vinter sköts av webbläsaren); resenärernas telefon visar redan lokal tid.
const sweTime = () => {
  try { return new Date().toLocaleTimeString("sv-SE", { timeZone: "Europe/Stockholm", hour: "2-digit", minute: "2-digit" }); }
  catch (e) { return hhmm(new Date(Date.now() + 3600000), true); }
};
const clampDay = (n) => Math.max(1, Math.min(TOTAL, n));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- lagring (kan saknas i privat läge) ----------
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---------- state ----------
const state = { view: null, viewAt: 0, weather: {}, photo: {} };

// ---------- väder ----------
const wxCache = {};
async function loadWeather(n) {
  const loc = DAYS[n][1];
  const date = isoDate(n);
  const isToday = n === todayNumber();
  const ck = `${loc}|${date}|${isToday}`;
  const hit = wxCache[ck];
  if (hit && Date.now() - hit.at < 30 * 60 * 1000) { state.weather[n] = hit.data; return hit.data; }
  const [lat, lon] = LOC[loc];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    (isToday ? "&current=temperature_2m,weather_code,is_day" : "") +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBangkok&start_date=${date}&end_date=${date}`;
  try {
    const res = await fetch(url);
    const j = await res.json();
    const data = res.ok && j.daily ? j : { unavailable: true };
    wxCache[ck] = { at: Date.now(), data };
    state.weather[n] = data;
    return data;
  } catch (e) { return null; }
}
const codeFrom = (w) => !w || w.unavailable ? null : w.current ? w.current.weather_code : (w.daily && w.daily.weather_code ? w.daily.weather_code[0] : null);

// ---------- Unsplash ----------
async function searchUnsplash(query) {
  const ck = "mira-unsplash2:" + query;
  const hit = lsGet(ck);
  if (hit && Date.now() - hit.at < 12 * 3600 * 1000) return hit.results;
  const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&orientation=portrait&per_page=15&content_filter=high&client_id=${UNSPLASH_KEY}`);
  if (!res.ok) throw new Error("unsplash " + res.status);
  const j = await res.json();
  const results = (j.results || []).map((p) => ({
    id: p.id,
    img: p.urls.raw + "&w=900&h=1600&fit=crop&q=72",
    name: p.user.name,
    profile: p.user.links && p.user.links.html,
    download: p.links.download_location,
    color: p.color || "",
    text: [p.description, p.alt_description].filter(Boolean).join(" ").toLowerCase(),
  }));
  lsSet(ck, { at: Date.now(), results });
  return results;
}
const lum = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return 0.5;
  const v = parseInt(m[1], 16);
  return (0.299 * (v >> 16) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) / 255;
};
const TOD_WORDS = {
  night: /night|evening|dark|neon|lights|lantern|nightlife|moon|stars|illuminat/,
  sunset: /sunset|dusk|evening|golden hour|twilight|sundown/,
  sunrise: /sunrise|dawn|morning|mist|fog|golden hour/,
};
const fitsTod = (p, tod) => {
  if (tod === "any") return true;
  if (tod === "day") return lum(p.color) > 0.25 && !TOD_WORDS.night.test(p.text);
  const word = TOD_WORDS[tod].test(p.text);
  if (tod === "night") return lum(p.color) < 0.22 || (word && lum(p.color) < 0.4);
  return word || lum(p.color) < 0.45;
};
const photoKeys = {};
async function loadPhoto(n, wcode) {
  if (!UNSPLASH_KEY) return;
  const loc = DAYS[n][1];
  const tod = n === todayNumber() ? timeOfDay() : "any";
  const raw = wxWord(wcode);
  const wx = (tod === "night" || tod === "sunset") && (raw === "sunny" || raw === "cloudy") ? null : raw;
  const slot = Math.floor(Date.now() / (ROTATE_MIN * 60000));
  const k = `${loc}|${tod}|${wx}|${slot}`;
  if (photoKeys[n] === k) return;
  photoKeys[n] = k;
  const [place, broad] = PHOTO_Q[loc];
  const todWord = tod === "day" || tod === "any" ? "" : tod;
  const tries = (tod === "night"
    ? [[place, "night", wx], [place, "night"], [place, "night lights"], [broad, "night"], [broad, "night city"]]
    : [[place, todWord, wx], [place, todWord], [place], [broad, todWord, wx], [broad, todWord], [broad]]
  ).map((a) => a.filter(Boolean).join(" "));
  const show = (results) => {
    const p = results[(n * 7 + slot) % results.length];
    const seen = lsGet("mira-unsplash-seen") || {};
    if (!seen[p.id]) { seen[p.id] = 1; lsSet("mira-unsplash-seen", seen); fetch(`${p.download}&client_id=${UNSPLASH_KEY}`).catch(() => {}); }
    state.photo[n] = p;
    if (n === currentDay()) render();
  };
  const pool = [];
  for (const q of tries) {
    try {
      const results = (await searchUnsplash(q)).filter((p) => fitsTod(p, tod));
      if (results.length >= 3) { show(results); return; }
      for (const p of results) if (!pool.some((x) => x.id === p.id)) pool.push(p);
    } catch (e) { photoKeys[n] = null; return; }
  }
  if (pool.length) show(pool);
}
async function loadDay(n) {
  const w = await loadWeather(n);
  if (n === currentDay()) render();
  loadPhoto(n, codeFrom(w));
}

// ---------- bakgrund med övertoning ----------
const fade = { cur: null };
function setBackground(img) {
  if (!img || img === fade.cur) return;
  const host = document.getElementById("imgHost");
  const old = host.querySelector(".bgimg");
  if (old && old.classList.contains("in")) document.getElementById("bg").style.backgroundImage = `url("${fade.cur}")`;
  fade.cur = img;
  const el = document.createElement("img");
  el.className = "bgimg";
  el.alt = "";
  // Ingen requestAnimationFrame: den pausas i bakgrundsflikar. En reflow räcker för att övergången ska starta.
  el.onload = () => { void el.offsetWidth; el.classList.add("in"); };
  el.src = img;
  host.replaceChildren(el);
}

// ---------- vy ----------
const currentDay = () => state.view != null ? state.view : clampDay(todayNumber());
const pct = (k) => ((k - 1) / (TOTAL - 1)) * 100;
const app = document.getElementById("app");

function weatherHtml(w, isToday, loc) {
  const href = `https://www.yr.no/en/forecast/daily-table/${LOC[loc].join(",")}`;
  if (!w) return `<a class="wx" href="${href}" target="_blank" rel="noopener"><div class="wxsub">Hämtar väder…</div></a>`;
  if (w.unavailable || !w.daily) return `<a class="wx" href="${href}" target="_blank" rel="noopener"><div class="wxsub">Ingen prognos än</div></a>`;
  const d = w.daily;
  const code = isToday && w.current ? w.current.weather_code : d.weather_code[0];
  const night = isToday && w.current ? w.current.is_day === 0 : false;
  const [icon, label] = WX(code, night);
  const max = Math.round(d.temperature_2m_max[0]), min = Math.round(d.temperature_2m_min[0]);
  const big = isToday && w.current ? Math.round(w.current.temperature_2m) : max;
  return `<a class="wx" href="${href}" target="_blank" rel="noopener" aria-label="Väder: ${label}, ${big} grader. Öppnar prognosen på yr.no">
    <div>${wxIcon(icon)}<span class="wxtemp">${big}°</span></div>
    <div class="wxsub">${label} · ${min}°/${max}°</div></a>`;
}

function render() {
  const today = todayNumber();
  if (today < 1 && state.view == null) {
    app.innerHTML = `<div class="head"><span class="brand">Vietnam – Thailand</span></div>
      <div class="state"><h1>${1 - today} ${1 - today === 1 ? "dag" : "dagar"} kvar</h1><p class="text">Resan börjar 4 november.</p></div>`;
    return;
  }
  if (today > TOTAL && state.view == null) {
    app.innerHTML = `<div class="head"><span class="brand">Vietnam – Thailand</span></div>
      <div class="state"><h1>Hemma igen</h1><p class="text">Resan tog slut 14 december.</p></div>`;
    return;
  }
  const todayC = clampDay(today);
  const n = currentDay();
  const isToday = n === today;
  const [place, loc, title, text] = DAYS[n];
  const photo = state.photo[n];
  if (photo) setBackground(photo.img);
  const t = TRAVEL[n];
  const tripHtml = t ? (() => {
    const tm = /buss|bil|motorcykel/i.test(t[0]) ? "driving" : /tåg/i.test(t[0]) ? "transit" : "";
    const href = `https://www.google.com/maps/dir/?api=1&origin=${LOC[t[3]].join(",")}&destination=${LOC[t[4]].join(",")}${tm ? "&travelmode=" + tm : ""}`;
    return `<a class="trip" href="${href}" target="_blank" rel="noopener">${esc(t[0])} ${esc(t[1])} · <b>ca ${t[2].toLocaleString("sv-SE")} km</b><span class="ext">↗</span></a>`;
  })() : "";
  const dots = Array.from({ length: TOTAL }, (_, i) => i + 1).filter((k) => k !== n)
    .map((k) => `<span class="${k <= todayC ? "dot past" : "dot"}" style="left: calc(10px + (100% - 20px) * ${pct(k) / 100})"></span>`).join("");
  const diff = Math.abs(n - today);
  const ut = photo && photo.profile ? "?utm_source=vietnam_thailand&utm_medium=referral" : "";

  app.innerHTML = `
    <div class="head">
      <span class="brand"><span class="day">Dag ${n} / ${TOTAL}</span></span>
      <a class="place" href="https://www.google.com/maps/search/?api=1&query=${LOC[loc].join(",")}" target="_blank" rel="noopener">${esc(place)}<span class="ext">↗</span></a>
    </div>
    <div class="panel">
      ${isToday ? "" : `<div class="viewing"><span>${n < today ? "Tillbakablick" : "Framåtblick"} · ${diff} dag${diff === 1 ? "" : "ar"} ${n < today ? "sedan" : "kvar"}</span><button class="back" id="back" type="button">Idag ↩</button></div>`}
      <div class="date">${dateStr(n)}</div>
      <div class="clockrow">
        <div><div class="clock">${hhmm(miraNow(), true)}</div><div class="clocklabel">lokal tid · Sverige ${sweTime()}</div></div>
        ${weatherHtml(state.weather[n], isToday, loc)}
      </div>
      <div class="sep"></div>
      <h1>${esc(title)}</h1>
      <p class="text">${esc(text)}</p>
      ${tripHtml}
      <div class="scrub">
        <div class="timeline">
          <div class="track"></div>
          <div class="fill" style="width: calc((100% - 20px) * ${pct(todayC) / 100})"></div>
          ${dots}
          <input id="day" type="range" min="1" max="${TOTAL}" step="1" value="${n}" aria-label="Välj dag">
        </div>
        <div class="foot">
          <span class="thumbdate">${dateOf(n).getUTCDate()} ${MONTHS[dateOf(n).getUTCMonth()]}</span>
          <span class="arrows">
            <button class="arrow" id="prev" type="button" ${n <= 1 ? "disabled" : ""} aria-label="Föregående dag"><svg width="14" height="14" viewBox="0 0 10 10" aria-hidden="true"><path d="M6.5 1.5 3 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="arrow" id="next" type="button" ${n >= TOTAL ? "disabled" : ""} aria-label="Nästa dag"><svg width="14" height="14" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 7 5 3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </span>
        </div>
      </div>
      <div class="credit">${photo ? `Foto: <a href="${esc((photo.profile || "https://unsplash.com") + ut)}" target="_blank" rel="noopener">${esc(photo.name)}</a> / <a href="https://unsplash.com/?utm_source=vietnam_thailand&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a>` : ""}</div>
    </div>`;

  const slider = document.getElementById("day");
  slider.addEventListener("input", () => setView(Number(slider.value), false));
  slider.addEventListener("change", () => setView(Number(slider.value), true));
  const prev = document.getElementById("prev"), next = document.getElementById("next"), back = document.getElementById("back");
  prev && prev.addEventListener("click", () => setView(n - 1, true));
  next && next.addEventListener("click", () => setView(n + 1, true));
  back && back.addEventListener("click", () => setView(todayC, true));
}

// Behåll fokus på reglaget medan man drar (render byter ut DOM:en).
function setView(m, load) {
  m = clampDay(m);
  const focusSlider = document.activeElement && document.activeElement.id === "day";
  state.view = m === clampDay(todayNumber()) ? null : m;
  state.viewAt = Date.now();
  render();
  if (focusSlider) { const s = document.getElementById("day"); s && s.focus(); }
  if (load) loadDay(m);
}

// Svep åt sidan för att byta dag (inte på reglaget).
let sx = null, sy = null;
document.addEventListener("touchstart", (e) => {
  if (e.target.closest("input, a, button")) { sx = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setView(currentDay() + (dx < 0 ? 1 : -1), true);
}, { passive: true });
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input")) return;
  if (e.key === "ArrowRight") setView(currentDay() + 1, true);
  if (e.key === "ArrowLeft") setView(currentDay() - 1, true);
});

// Varje halvminut: klocka, snäpp tillbaka till idag efter 2 min, ny bild när det är dags.
function tick() {
  if (state.view != null && Date.now() - state.viewAt > SNAP_BACK_MS) state.view = null;
  const s = document.getElementById("day");
  if (!(s && document.activeElement === s)) render();
  loadDay(currentDay());
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
setInterval(tick, 30 * 1000);
render();
loadDay(currentDay());
</script>
