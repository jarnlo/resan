  /* Helskärm: bilden är bakgrunden, allt innehåll ligger i en panel längst ner (tummens zon). */
  :root {
    --ink: #fff;
    --ink-2: rgba(255,255,255,.74);
    --ink-3: rgba(255,255,255,.5);
    --line: rgba(255,255,255,.16);
    --chip: rgba(255,255,255,.14);
    --glass: rgba(20,17,15,.38);
    --accent: #ff7a45;
    --accent-2: #ffb26b;
    --note: #ffd27a;
    --ground: #14110f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Exakt en skärm hög, ingen scroll: innehållet ligger i botten. */
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-shadow: 0 1px 3px rgba(0,0,0,.45);
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }

  .bg, .bgimg, .shade { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bg { background-size: cover; background-position: center; }
  .bgimg { object-fit: cover; opacity: 0; transition: opacity 1.6s ease; }
  .bgimg.in { opacity: 1; }
  .shade { background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.08) 24%, rgba(0,0,0,.25) 45%, rgba(0,0,0,.86) 78%); }

  main {
    position: relative; height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    padding-top: max(16px, env(safe-area-inset-top, 0px));
    padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    max-width: 560px; margin: 0 auto;
  }
  .head { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  /* Platta bakom ort + dag så att texten syns mot ljus himmel. Negativ marginal = texten står kvar i vänsterkanten. */
  .where { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0;
           max-width: calc(100% + 20px); margin-left: -10px; padding: 7px 10px 8px; border-radius: 12px;
           background: rgba(20,17,15,.22); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .where .day { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--ink); }
  .brand { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; font-weight: 800; white-space: nowrap; padding-top: 6px; }
  .brand .day { color: var(--accent); letter-spacing: .08em; }
  .place { display: block; max-width: 100%; font-size: 28px; font-weight: 700; line-height: 1.05; letter-spacing: -.01em; white-space: nowrap; }
  .ext { font-size: .7em; font-weight: 400; opacity: .55; margin-left: .35em; vertical-align: .15em; }

  .panel { margin-top: auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .panel::-webkit-scrollbar { display: none; }
  .viewing { margin-top: 3px; font-size: 13px; color: var(--note); }
  .back { display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px; border: 0; border-radius: 10px;
          background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; text-shadow: none; cursor: pointer; }
  [hidden] { display: none !important; }
  .footrow { margin-top: 26px; display: flex; align-items: center; gap: 12px; }
  .upload { border: 0; font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer;
            background: var(--glass); color: var(--ink); text-shadow: none; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .minelink { border: 0; background: none; padding: 8px 0; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; text-shadow: none;
              text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255,255,255,.3); }
  .sheet-box.tall { max-height: 80dvh; grid-template-rows: auto 1fr; }
  .mine-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mine-list { overflow-y: auto; display: grid; gap: 18px; padding-right: 2px; }
  .mine-day h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .mine-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mine-item { margin: 0; display: grid; gap: 6px; }
  .mine-go { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 10px; overflow: hidden; aspect-ratio: 1; }
  .mine-go img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mine-del { border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 12px; font-weight: 600; padding: 7px 0; border-radius: 9px; cursor: pointer; }
  .mine-del.confirm { background: #c8442f; color: #fff; }
  .langrow { margin-left: auto; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 12px; text-shadow: none; }
  .lang { border: 0; background: none; padding: 6px 2px; color: var(--ink-3); font: inherit; letter-spacing: .06em; cursor: pointer; }
  .lang[aria-pressed="true"] { color: var(--ink); font-weight: 600; cursor: default; }
  .langsep { color: var(--ink-3); opacity: .6; }
  .date { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
  .clockrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 14px 0 12px; min-height: 58px; }

  .clocklabel { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); margin-bottom: 4px; }

  .wxtemp { font-size: 30px; font-weight: 600; margin-left: 4px; }

  .sep { height: 1px; background: var(--line); margin: 4px 0 18px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; font-weight: 700; text-wrap: balance; }
  .text { font-size: 18px; line-height: 1.45; margin: 0; color: rgba(255,255,255,.92); }

  .scrub { width: 100%; margin: -6px 0 -4px; }
  .timeline { position: relative; height: 30px; touch-action: none; }
  .track, .fill { position: absolute; left: 10px; top: 14px; height: 2px; border-radius: 1px; }
  .track { right: 10px; background: rgba(255,255,255,.2); }
  .fill { background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 8px rgba(255,122,69,.6); }
  .dot { position: absolute; top: 13px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%;
         background: rgba(255,255,255,.3); pointer-events: none; }
  .dot.past { background: var(--accent-2); }
  .thumb { position: absolute; top: 9px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
           background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); pointer-events: none; transition: transform .15s; }
  .timeline { cursor: pointer; }
  .timeline.dragging .thumb { transform: scale(1.3); }
  .timeline:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 4px; border-radius: 8px; }
  .arrows { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .arrow { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--glass); color: var(--ink); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
           display: grid; place-items: center; cursor: pointer; }
  .arrow:active { transform: scale(.94); }
  .arrow:disabled { opacity: .35; }
  .arrow:focus-visible, .back:focus-visible, a:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  /* Unsplash kräver kreditering; hålls så diskret som möjligt. */
  /* Unsplash kräver kreditering: diskret, uppe till höger i höjd med pilarna. */
  .credit { position: fixed; z-index: 3; top: calc(max(16px, env(safe-area-inset-top, 0px)) + 11px);
            right: max(18px, env(safe-area-inset-right, 0px)); max-width: calc(100vw - 270px); text-align: right;
            font-size: 9px; line-height: 1.35; color: rgba(255,255,255,.32); text-shadow: none; letter-spacing: .02em; }
  .credit a { text-decoration: none; }
  /* Egna foton: samma diskreta kredit, namnet och "Ta bort" går att trycka på. */
  .credit button { border: 0; background: none; padding: 4px 0; margin: -4px 0; color: inherit; font: inherit; cursor: pointer; }
  .credit button:hover, .credit button:focus-visible { color: var(--ink); }
  .credit .del { text-decoration: underline; text-underline-offset: 2px; }
  .sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
           background: rgba(0,0,0,.55); padding: 16px; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
  .sheet-box { width: 100%; max-width: 420px; background: #1f1b18; border-radius: 18px; padding: 20px; display: grid; gap: 12px; text-shadow: none; }

  .sheet-box p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.4; }

           border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); }
  .sheet-row { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { border: 0; font: inherit; font-size: 15px; font-weight: 600; padding: 11px 16px; border-radius: 12px; cursor: pointer;
         background: var(--chip); color: var(--ink); display: inline-flex; align-items: center; }
  .btn.primary { background: var(--accent); color: #1a0d06; }
  .btn.danger { background: #c8442f; color: #fff; }
  .sheet-err { color: #ff9a85 !important; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(24px, env(safe-area-inset-bottom, 0px)); z-index: 15;
           background: rgba(20,17,15,.85); padding: 10px 16px; border-radius: 12px; font-size: 14px; text-shadow: none;
           -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .state { margin-top: auto; }
  .state h1 { font-size: 34px; }
  @media (prefers-reduced-motion: reduce) { .bgimg { transition: none; } }
</style>

const wxCache = {};
async function loadWeather(n) {
  const loc = DAYS[n][1];
  const date = isoDate(n);
  const isToday = n === todayNumber();
  const ck = `${loc}|${date}|${isToday}`;
  const hit = wxCache[ck];
  if (hit && Date.now() - hit.at < 30 * 60 * 1000) { state.weather[n] = hit.data; return hit.data; }
  const [lat, lon] = LOC[loc];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    (isToday ? "&current=temperature_2m,weather_code,is_day" : "") +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBangkok&start_date=${date}&end_date=${date}`;
  try {
    const res = await fetch(url);
    const j = await res.json();
    const data = res.ok && j.daily ? j : { unavailable: true };
    wxCache[ck] = { at: Date.now(), data };
    state.weather[n] = data;
    return data;
  } catch (e) { return null; }
}

// ---------- Unsplash ----------
async function searchUnsplash(query) {
  const ck = "mira-unsplash2:" + query;
  const hit = lsGet(ck);
  if (hit && Date.now() - hit.at < 12 * 3600 * 1000) return hit.results;
  const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&orientation=portrait&per_page=15&content_filter=high&client_id=${UNSPLASH_KEY}`);
  if (!res.ok) throw new Error("unsplash " + res.status);
  const j = await res.json();
  const results = (j.results || []).map((p) => ({
    id: p.id,
    img: p.urls.raw + "&w=900&h=1600&fit=crop&q=72",
    name: p.user.name,
    profile: p.user.links && p.user.links.html,
    download: p.links.download_location,
    color: p.color || "",
    text: [p.description, p.alt_description].filter(Boolean).join(" ").toLowerCase(),
  }));
  lsSet(ck, { at: Date.now(), results });
  return results;
}
const lum = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return 0.5;
  const v = parseInt(m[1], 16);
  return (0.299 * (v >> 16) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) / 255;
};
const TOD_WORDS = {
  night: /night|evening|dark|neon|lights|lantern|nightlife|moon|stars|illuminat/,
  sunset: /sunset|dusk|evening|golden hour|twilight|sundown/,
  sunrise: /sunrise|dawn|morning|mist|fog|golden hour/,
};
const fitsTod = (p, tod) => {
  if (tod === "any") return true;
  if (tod === "day") return lum(p.color) > 0.25 && !TOD_WORDS.night.test(p.text);
  const word = TOD_WORDS[tod].test(p.text);
  if (tod === "night") return lum(p.color) < 0.22 || (word && lum(p.color) < 0.4);
  return word || lum(p.color) < 0.45;
};
const photoKeys = {};
async function loadPhoto(n, wcode) {
  if (!UNSPLASH_KEY) return;
  const loc = DAYS[n][1];
  const tod = n === todayNumber() ? timeOfDay() : "any";
  // Unsplash-nyckeln har 50 sökningar/timme och delas av alla. Därför inget väderord i sökningen här,
  // och så få reservsökningar som möjligt.
  const slot = Math.floor(Date.now() / (ROTATE_MIN * 60000));
  const k = `${loc}|${tod}|${slot}`;
  if (photoKeys[n] === k) return;
  photoKeys[n] = k;
  const [place, broad] = PHOTO_Q[loc];
  const todWord = tod === "day" || tod === "any" ? "" : tod;
  const tries = (tod === "night"
    ? [[place, "night"], [place, "night lights"], [broad, "night"]]
    : [[place, todWord], [place], [broad, todWord], [broad]]
  ).map((a) => a.filter(Boolean).join(" "));
  const show = (results) => {
    const p = results[(n * 7 + slot) % results.length];
    const seen = lsGet("mira-unsplash-seen") || {};
    if (!seen[p.id]) { seen[p.id] = 1; lsSet("mira-unsplash-seen", seen); fetch(`${p.download}&client_id=${UNSPLASH_KEY}`).catch(() => {}); }
    state.photo[n] = p;
    state.noPhoto[n] = false;
    if (n === currentDay()) render();
  };
  const pool = [];
  for (const q of tries) {
    try {
      const results = (await searchUnsplash(q)).filter((p) => fitsTod(p, tod));
      if (results.length >= 3) { show(results); return; }
      for (const p of results) if (!pool.some((x) => x.id === p.id)) pool.push(p);
    } catch (e) { photoKeys[n] = null; break; }
  }
  if (pool.length) { show(pool); return; }
  // Ingen bild att få (t.ex. slut på kvoten): hellre ingen bild än förra ortens.
  if (!state.photo[n]) { state.noPhoto[n] = true; if (n === currentDay()) render(); }
}

  if (!img || img === fade.cur) return;
  const host = document.getElementById("imgHost");
  const old = host.querySelector(".bgimg");
  if (old && old.classList.contains("in")) document.getElementById("bg").style.backgroundImage = `url("${fade.cur}")`;
  fade.cur = img;
  const el = document.createElement("img");
  el.className = "bgimg";

  el.onload = () => { void el.offsetWidth; el.classList.add("in"); };

}

      <button class="upload" id="upload" type="button" hidden>${T("upload")}</button>
      <button class="minelink" id="mine" type="button" hidden></button>
      <div class="langrow" role="group" aria-label="Språk / Language">
        <button class="lang" type="button" data-lang="sv" lang="sv" aria-label="Svenska" aria-pressed="${L === "sv"}">SV</button><span class="langsep" aria-hidden="true">|</span><button class="lang" type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="${L === "en"}">EN</button>
      </div>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>`;
  document.getElementById("prev").addEventListener("click", () => setView(currentDay() - 1, true));
  document.getElementById("next").addEventListener("click", () => setView(currentDay() + 1, true));
  app.addEventListener("click", (e) => { if (e.target.closest("#back")) setView(clampDay(todayNumber()), true); });

  // Tryck eller dra var som helst på tidslinjen.
  const tl = document.getElementById("timeline");
  const dayAt = (x) => {
    const r = tl.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (x - r.left - 10) / (r.width - 20)));
    return 1 + Math.round(f * (TOTAL - 1));
  };
  tl.addEventListener("pointerdown", (e) => {
    tl.setPointerCapture(e.pointerId);
    tl.classList.add("dragging");
    setView(dayAt(e.clientX), false);
  });
  tl.addEventListener("pointermove", (e) => {
    if (!tl.hasPointerCapture(e.pointerId)) return;
    const d = dayAt(e.clientX);
    if (d !== currentDay()) setView(d, false);
  });
  const release = (e) => {
    if (!tl.classList.contains("dragging")) return;
    tl.classList.remove("dragging");
    loadDay(currentDay());
  };
  tl.addEventListener("pointerup", release);
  tl.addEventListener("pointercancel", release);
  tl.addEventListener("keydown", (e) => {
    const k = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (k) { e.preventDefault(); setView(currentDay() + k, true); }
    if (e.key === "Home") { e.preventDefault(); setView(1, true); }
    if (e.key === "End") { e.preventDefault(); setView(TOTAL, true); }
  });
  shell = true;
}

function render() {
  const today = todayNumber();
  if ((today < 1 || today > TOTAL) && state.view == null) {
    shell = false;
    app.innerHTML = today < 1
      ? `<div class="head"><span class="brand">Vietnam – Thailand</span></div>
         <div class="state"><h1>${T("before", 1 - today)}</h1><p class="text">${T("beforeText")}</p></div>`
      : `<div class="head"><span class="brand">Vietnam – Thailand</span></div>
         <div class="state"><h1>${T("after")}</h1><p class="text">${T("afterText")}</p></div>`;
    return;
  }
  if (!shell) buildShell();
  const todayC = clampDay(today);
  const n = currentDay();
  const isToday = n === today;
  const [place, loc] = DAYS[n];
  const title = dayTitle(n), text = dayText(n);
  const own = state.own[n] || [];
  const ownI = own.length ? (Math.floor(Date.now() / (ROTATE_MIN * 60000)) + state.ownIdx) % own.length : 0;
  const photo = own.length ? null : state.photo[n];
  if (own.length) setBackground(own[ownI].url);
  else if (photo) setBackground(photo.img);
  else if (state.noPhoto[n]) clearBackground();
  const t = TRAVEL[n];
  // Resdagar: ortnamnet öppnar rutten och dagraden får färdsätt + distans. Övriga dagar: kartan för orten.
  const tm = t ? (/buss|bil|motorcykel/i.test(t[0]) ? "driving" : /tåg/i.test(t[0]) ? "transit" : "") : "";
  const placeHref = t
    ? `https://www.google.com/maps/dir/?api=1&origin=${LOC[t[3]].join(",")}&destination=${LOC[t[4]].join(",")}${tm ? "&travelmode=" + tm : ""}`
    : `https://www.google.com/maps/search/?api=1&query=${LOC[loc].join(",")}`;
  const tripLine = t ? ` · ${esc(modeName(t[0]))} · ${T("approx")} ${t[2].toLocaleString(L === "en" ? "en-GB" : "sv-SE")} km` : "";
  const diff = Math.abs(n - today);
  const ut = photo && photo.profile ? "?utm_source=vietnam_thailand&utm_medium=referral" : "";

  document.getElementById("where").innerHTML = `
    <a class="place" href="${placeHref}" target="_blank" rel="noopener"${t ? ` aria-label="${esc(T("tripAria", modeName(t[0]), t[1], t[2]))}"` : ""}>${esc(place)}<span class="ext">↗</span></a>
    <span class="day">${T("day")} ${n} / ${TOTAL}${tripLine}</span>`;
  document.getElementById("content").innerHTML = `
    <div class="date">${dateStr(n)}</div>
    ${isToday ? "" : `<div class="viewing"><span>${n < today ? T("back", diff) : T("ahead", diff)}</span></div>`}
    <div class="clockrow">
      <div class="clocks">
        <div><div class="clocklabel">${country(n)}</div><div class="clock">${hhmm(miraNow(), true)}</div></div>
        <div><div class="clocklabel">${T("sweden")}</div><div class="clock">${sweTime()}</div></div>
      </div>
      ${weatherHtml(state.weather[n], isToday, loc)}
    </div>
    <div class="sep"></div>
    <h1>${esc(title)}</h1>
    <p class="text">${esc(text)}</p>
    `;
  const credit = document.getElementById("credit");
  credit.innerHTML = own.length
    ? `<button type="button" id="ownNext" aria-label="${T("nextPhoto")}">${T("photo")}: ${esc(own[ownI].by || T("ownPhoto"))}${own.length > 1 ? ` · ${ownI + 1}/${own.length}` : ""}</button>${own[ownI].mine ? `<br><button type="button" class="del" id="ownDel" data-file="${esc(own[ownI].file)}">${T("del")}</button>` : ""}`
    : photo
    ? `${T("photo")}: <a href="${esc((photo.profile || "https://unsplash.com") + ut)}" target="_blank" rel="noopener">${esc(photo.name)}</a> / <a href="https://unsplash.com/?utm_source=vietnam_thailand&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a>`
    : "";

  // Tidslinjen uppdateras på plats.
  const at = (k) => `calc(10px + (100% - 20px) * ${pct(k) / 100})`;
  document.getElementById("fill").style.width = `calc((100% - 20px) * ${pct(todayC) / 100})`;
  document.getElementById("dots").innerHTML = Array.from({ length: TOTAL }, (_, i) => i + 1).filter((k) => k !== n)
    .map((k) => `<span class="${k <= todayC ? "dot past" : "dot"}" style="left: ${at(k)}"></span>`).join("");
  document.getElementById("thumb").style.left = at(n);
  const tl = document.getElementById("timeline");
  tl.setAttribute("aria-valuenow", n);
  tl.setAttribute("aria-valuetext", `${T("day")} ${n}, ${dateStr(n)}, ${place}`);
  fitPlace();
  document.getElementById("prev").disabled = n <= 1;
  document.getElementById("next").disabled = n >= TOTAL;
  document.getElementById("back").hidden = isToday;
  document.getElementById("upload").hidden = !(api && codeOk);
  const nMine = myPhotos().reduce((t, [, l]) => t + l.length, 0);
  const mineBtn = document.getElementById("mine");
  mineBtn.hidden = !(api && codeOk && nMine);
  mineBtn.textContent = `${T("mine")} (${nMine})`;
}

// ---------- egna bilder (api.php på Inleed) ----------
const CODE_KEY = "resan-kod";
// Telefonens egen hemliga nyckel: bara den som laddat upp en bild kan ta bort den.
const OWNER_KEY = "resan-agare";
const ownerToken = (() => {
  let t = ""; try { t = localStorage.getItem(OWNER_KEY) || ""; } catch (e) {}
  if (!/^[a-f0-9]{32}$/.test(t)) {
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    t = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    try { localStorage.setItem(OWNER_KEY, t); } catch (e) {}
  }
  return t;
})();
const apiFetch = (action, body) => fetch(`api.php?action=${action}`, {
  method: body ? "POST" : "GET", body, cache: "no-store", headers: { "X-Resan-Owner": ownerToken },
});
const NAME_KEY = "resan-namn";
const getName = () => { try { return localStorage.getItem(NAME_KEY) || ""; } catch (e) { return ""; } };
const setName = (n) => { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} };
const getCode = () => { try { return localStorage.getItem(CODE_KEY) || ""; } catch (e) { return ""; } };
const setCode = (c) => { try { c ? localStorage.setItem(CODE_KEY, c) : localStorage.removeItem(CODE_KEY); } catch (e) {} };

async function loadOwn() {
  try {
    const res = await apiFetch("list");
    const j = await res.json();
    if (!res.ok || !j.days) return;
    api = true;
    state.own = j.days;
    render();
  } catch (e) { /* ingen server (t.ex. GitHub Pages) – funktionen syns inte */ }
}

let toastTimer;
function toast(msg, ms) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => t.remove(), ms);
}

function sheet(html) {
  closeSheet();
  const el = document.createElement("div");
  el.className = "sheet";
  el.id = "sheet";
  el.innerHTML = `<div class="sheet-box" role="dialog" aria-modal="true">${html}</div>`;
  el.addEventListener("click", (e) => { if (e.target === el || e.target.closest("[data-close]")) closeSheet(); });
  document.body.appendChild(el);
  return el;
}
const closeSheet = () => { const el = document.getElementById("sheet"); if (el) el.remove(); };

// Koden kommer via en delad länk: …/#kod=XXXX (eller ?kod=XXXX). Den kontrolleras, sparas och tas bort ur adressen.
async function verifyCode() {
  const m = /[#&?]kod=([^&]+)/.exec(location.hash + location.search);
  if (m) {
    setCode(decodeURIComponent(m[1]).trim());
    history.replaceState(null, "", location.pathname);
  }
  if (!getCode()) { codeOk = false; return; }
  const fd = new FormData(); fd.append("code", getCode());
  const res = await apiFetch("check", fd).catch(() => null);
  if (res && res.status === 403) { setCode(""); codeOk = false; }
  else codeOk = !!(res && res.ok);
  render();
}

// Första uppladdningen: bara namnet (koden har telefonen redan). Bilder väljs via en etikett,
// en riktig tryckning, vilket iPhone kräver för filväljaren.
function askName() {
  const el = sheet(`<h2>${T("addTitle")}</h2>
    <p>${T("nameText")}</p>
    <form id="nameForm" style="display:grid;gap:12px">
      <input type="text" id="nameInput" autocomplete="given-name" placeholder="${T("yourName")}" aria-label="${T("yourName")}" maxlength="40" required value="${esc(getName())}">
      <div class="sheet-row"><button type="button" class="btn" data-close>${T("cancel")}</button><button class="btn primary">${T("go")}</button></div>
    </form>`);
  el.querySelector("#nameInput").focus();
  el.querySelector("#nameForm").addEventListener("submit", (e) => {
    e.preventDefault();
    setName(el.querySelector("#nameInput").value.trim());
    el.querySelector(".sheet-box").innerHTML = `<h2>${T("thanks", esc(getName()))}</h2>
      <p>${T("whereTo", currentDay(), dateStr(currentDay()))}</p>
      <div class="sheet-row"><button type="button" class="btn" data-close>${T("later")}</button><label class="btn primary" for="file">${T("choose")}</label></div>`;
  });
}


// Skala ner i telefonen före uppladdning (snabbt även på mobildata). Servern skalar och rensar igen.
async function shrink(file) {
  let img;
  try { img = await createImageBitmap(file); }
  catch (e) {
    img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = URL.createObjectURL(file); });
  }
  const w = img.width, h = img.height, k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
}

async function uploadFiles(files) {
  const day = currentDay();
  let done = 0, failed = 0;
  for (const f of files) {
    toast(T("uploading", done + failed + 1, files.length));
    try {
      const blob = await shrink(f);
      const fd = new FormData();
      fd.append("code", getCode()); fd.append("day", String(day)); fd.append("name", getName()); fd.append("photo", blob, "bild.jpg");
      const res = await apiFetch("upload", fd);
      if (res.status === 403) { setCode(""); codeOk = false; render(); toast(T("codeGone"), 5000); return; }
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "fel");
      done++;
    } catch (e) { failed++; }
  }
  state.ownIdx = 0;
  await loadOwn();
  toast(failed ? T("upSome", done, failed) : T("upDone", done, day), 4000);
}

// Tar bort en egen bild. Returnerar true om det gick.
async function deleteFile(file) {
  const fd = new FormData(); fd.append("code", getCode()); fd.append("file", file);
  const res = await apiFetch("delete", fd).catch(() => null);
  if (res && res.status === 403) {
    const j = await res.json().catch(() => ({}));
    if (/kod/i.test(j.error || "")) { setCode(""); codeOk = false; closeSheet(); render(); toast(T("codeGone"), 4000); }
    else toast(T("delNotYours"), 4000);
    return false;
  }
  if (!res || !res.ok) { toast(T("delFail"), 4000); return false; }
  state.ownIdx = 0;
  await loadOwn();
  if (!(state.own[currentDay()] || []).length) loadDay(currentDay());
  return true;
}

function askDelete(file) {
  const el = sheet(`<h2>${T("delTitle")}</h2>
    <p>${T("delText", currentDay())}</p>
    <div class="sheet-row"><button type="button" class="btn" data-close>${T("cancel")}</button><button type="button" class="btn danger" id="delOk">${T("del")}</button></div>`);
  el.querySelector("#delOk").addEventListener("click", async () => {
    closeSheet();
    if (await deleteFile(file)) toast(T("delDone"), 3000);
  });
}

// "Mina foton": egna bilder per dag. Tryck på en bild = gå till dagen. "Ta bort" frågar "Säker?" på plats.
const myPhotos = () => Object.entries(state.own)
  .map(([d, list]) => [Number(d), list.filter((o) => o.mine)])
  .filter(([, list]) => list.length)
  .sort((a, b) => a[0] - b[0]);

function openMine() {
  const groups = myPhotos();
  const html = groups.length ? groups.map(([d, list]) => `
      <section class="mine-day">
        <h3>${T("day")} ${d} · ${dateStr(d)} · ${esc(DAYS[d][0])}</h3>
        <div class="mine-grid">${list.map((o) => `
          <figure class="mine-item">
            <button type="button" class="mine-go" data-day="${d}" aria-label="${T("day")} ${d}"><img src="${esc(o.url)}" alt="" loading="lazy"></button>
            <button type="button" class="mine-del" data-file="${esc(o.file)}">${T("del")}</button>
          </figure>`).join("")}
        </div>
      </section>`).join("") : `<p>${T("mineEmpty")}</p>`;
  const el = sheet(`<div class="mine-head"><h2>${T("mine")}</h2><button type="button" class="btn" data-close>${T("close")}</button></div>
    <div class="mine-list">${html}</div>`);
  el.querySelector(".sheet-box").classList.add("tall");
}

document.addEventListener("click", async (e) => {
  if (e.target.closest("#mine")) { openMine(); return; }
  const go = e.target.closest(".mine-go");
  if (go) { closeSheet(); setView(Number(go.dataset.day), true); return; }
  const md = e.target.closest(".mine-del");
  if (md) {
    if (!md.classList.contains("confirm")) {
      document.querySelectorAll(".mine-del.confirm").forEach((b) => { b.classList.remove("confirm"); b.textContent = T("del"); });
      md.classList.add("confirm"); md.textContent = T("sure");
      return;
    }
    md.disabled = true;
    if (await deleteFile(md.dataset.file)) { toast(T("delDone"), 2500); if (document.getElementById("sheet")) openMine(); }
    else md.disabled = false;
  }
});

document.addEventListener("click", (e) => {
  if (e.target.closest("#upload")) { if (getName()) document.getElementById("file").click(); else askName(); }
  if (e.target.closest("#ownNext")) { state.ownIdx++; render(); }
  const lb = e.target.closest(".lang");
  if (lb && lb.dataset.lang !== L) {
    L = lb.dataset.lang;
    try { localStorage.setItem(LANG_KEY, L); } catch (err) {}
    document.documentElement.lang = L;
    shell = false;
    render();
  }
  const del = e.target.closest("#ownDel");
  if (del) askDelete(del.dataset.file);
});
document.addEventListener("change", (e) => {
  if (e.target.id !== "file") return;
  const files = [...e.target.files];
  e.target.value = "";
  closeSheet();
  if (files.length) uploadFiles(files);
});

// Ortnamnet ska alltid rymmas på en rad: krymp från 28 px tills det får plats.
function fitPlace() {
  const el = document.querySelector(".where .place");
  const box = document.getElementById("where");
  if (!el || !box) return;
  const max = app.clientWidth - parseFloat(getComputedStyle(app).paddingLeft) - parseFloat(getComputedStyle(app).paddingRight);
  // (plattan sticker ut 10 px till vänster och har 10 px padding på var sida → samma textbredd som sidan)
  let size = 28;
  el.style.fontSize = size + "px";
  while (el.scrollWidth > max && size > 16) { size -= 1; el.style.fontSize = size + "px"; }
}
addEventListener("resize", fitPlace);

function setView(m, load) {
  m = clampDay(m);
  state.view = m === clampDay(todayNumber()) ? null : m;
  state.viewAt = Date.now();
  render();
  if (load) loadDay(m);
}

// Svep åt sidan för att byta dag (inte på reglaget).
let sx = null, sy = null;
document.addEventListener("touchstart", (e) => {
  if (e.target.closest("#timeline, a, button")) { sx = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setView(currentDay() + (dx < 0 ? 1 : -1), true);
}, { passive: true });
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("#timeline")) return;
  if (e.key === "ArrowRight") setView(currentDay() + 1, true);
  if (e.key === "ArrowLeft") setView(currentDay() - 1, true);
});

// Varje halvminut: klocka, snäpp tillbaka till idag efter 2 min, ny bild när det är dags.
function tick() {
  if (state.view != null && Date.now() - state.viewAt > SNAP_BACK_MS) state.view = null;
  const tl = document.getElementById("timeline");
  if (!(tl && tl.classList.contains("dragging"))) render();
  loadDay(currentDay());
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
setInterval(tick, 30 * 1000);
render();
loadDay(currentDay());
loadOwn().then(verifyCode);
setInterval(() => { if (api && !document.hidden) loadOwn(); }, 2 * 60 * 1000);
</script>
